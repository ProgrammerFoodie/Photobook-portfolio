# nginx site for https://ugis.id.lv  → Node app on 127.0.0.1:3000 (service: photos.service)
# Installed as /etc/nginx/sites-available/portfolio (the file sites-enabled/portfolio includes).
# The previous Laravel config is kept next to it as portfolio.bak-2026-10-06-pre-photos.

server {
    listen 80;
    listen [::]:80;
    server_name ugis.id.lv;

    # Let's Encrypt renewal challenges (same convention as the other sites on this server)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://ugis.id.lv$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ugis.id.lv;

    ssl_certificate /etc/letsencrypt/live/ugis.id.lv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ugis.id.lv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/portfolio_access.log;
    error_log /var/log/nginx/portfolio_error.log;

    # the app sets its own CSP, nosniff, referrer and frame headers; HSTS belongs here
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # admin uploads: the app accepts up to 100 MB per photo
    client_max_body_size 110M;

    # the app does not compress, nginx does (photos are already compressed formats)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # inherited by every location below
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # album zips are streamed: don't spool them to disk on the way through
    location /dl/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
